services:
  - type: web
    name: musie-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADGUARD_ENABLED
        value: "true"
      - key: SPONSORBLOCK_ENABLED
        value: "true"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: YT_COOKIES_CONTENT
        sync: false
